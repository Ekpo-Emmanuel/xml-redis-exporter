name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Unit tests
        run: |
          npm ci
          npm test

      - name: Export XML to Redis with Docker Compose
        run: |
          chmod +x export.sh
          ./export.sh -v fixtures/config.xml
